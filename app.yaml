command:
  - "python"
  - "app.py"

env:
  # Lakebase connection URL, read from the Databricks secret scope at runtime.
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # National Weather Service API. No key required - but the User-Agent is,
  # and it must identify your app with a real contact address.
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: NWS_USER_AGENT
    value: "weather-intelligence-app (you@example.com)"

  # Default locations for POST /weather/sync (semicolon-separated).
  - name: WEATHER_LOCATIONS
    value: "Chicago, IL;Austin, TX;Miami, FL"

  # Must match the VECTOR(n) column width in weather_embeddings.
  - name: EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: EMBEDDING_DIM
    value: "384"

  # Warm the model at boot so the first search isn't slow.
  - name: PRELOAD_EMBEDDING_MODEL
    value: "1"
