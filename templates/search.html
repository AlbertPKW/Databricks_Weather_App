<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Intelligence — Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:   #eef1ed;
    --card:    #ffffff;
    --ink:     #16202b;
    --muted:   #64757f;
    --rule:    #cdd7d2;
    --deep:    #1f4e5f;
    --deep-lo: #2c6b7f;
    --warning:  #d8472b;
    --watch:    #d99219;
    --advisory: #6e5aa8;
    --calm:     #3f7d5a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px 80px;
    background:
      linear-gradient(var(--rule) 1px, transparent 1px) 0 0 / 100% 28px,
      var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    line-height: 1.6;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  header { border-bottom: 2px solid var(--ink); padding-bottom: 14px; }

  .eyebrow {
    font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--deep);
  }

  h1 {
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 42px);
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 8px 0 6px;
  }

  .lede { color: var(--muted); max-width: 58ch; margin: 0; }

  nav { margin-top: 18px; display: flex; gap: 18px; font-size: 12px; }
  nav a { color: var(--deep); text-decoration: none; border-bottom: 1px solid var(--rule); }
  nav a:hover, nav a:focus-visible { border-bottom-color: var(--deep); }
  nav a[aria-current="page"] { color: var(--ink); border-bottom: 2px solid var(--ink); }

  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--deep);
    padding: 22px;
    margin-top: 26px;
  }

  label {
    display: block; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 0;
    background: var(--paper);
    color: var(--ink);
    font: inherit;
  }
  input:focus-visible, select:focus-visible {
    outline: 2px solid var(--deep); outline-offset: 1px; background: #fff;
  }

  .row { display: grid; grid-template-columns: 1fr 130px 1fr; gap: 14px; margin-top: 18px; }
  @media (max-width: 620px) { .row { grid-template-columns: 1fr; } }

  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .examples button {
    font: 400 12px/1 "IBM Plex Mono", monospace;
    text-transform: none; letter-spacing: 0;
    padding: 6px 10px;
    border: 1px dashed var(--rule);
    background: transparent; color: var(--muted);
  }
  .examples button:hover { border-color: var(--deep); color: var(--deep); background: transparent; }

  button {
    font: 500 13px/1 "IBM Plex Mono", monospace;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 12px 20px;
    border: 1px solid var(--deep);
    background: var(--deep); color: #fff; cursor: pointer;
    transition: background .15s ease;
  }
  button:hover:not(:disabled) { background: var(--deep-lo); }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .actions { margin-top: 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .actions label {
    display: flex; align-items: center; gap: 7px; margin: 0;
    text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink);
  }

  .status { margin-top: 16px; font-size: 13px; min-height: 1.6em; }
  .status.error { color: var(--warning); }

  .summary {
    margin-top: 26px; padding: 20px;
    background: #fff; border: 1px solid var(--rule); border-left: 3px solid var(--watch);
  }
  .summary p { margin: 8px 0 0; }

  .hit {
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--rule);
    padding: 18px 20px;
    margin-top: 14px;
  }
  .hit.alert { border-left-color: var(--warning); }
  .hit.forecast { border-left-color: var(--deep); }

  .hit-top {
    display: flex; justify-content: space-between; gap: 16px;
    align-items: flex-start; flex-wrap: wrap;
  }

  .hit-meta {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }

  .chip { padding: 2px 8px; border: 1px solid currentColor; font-size: 10px; letter-spacing: 0.1em; }
  .chip.alert { color: var(--warning); }
  .chip.forecast { color: var(--deep); }
  .chip.Extreme, .chip.Severe { color: var(--warning); }
  .chip.Moderate { color: var(--watch); }
  .chip.Minor, .chip.Unknown { color: var(--advisory); }

  /* Signature: similarity drawn as a stepped intensity scale, the way a radar
     legend bins reflectivity — a bare 0.734 says much less at a glance. */
  .scale { display: flex; align-items: center; gap: 8px; }
  .scale-bars { display: flex; gap: 2px; }
  .scale-bars i {
    display: block; width: 7px; height: 16px;
    background: var(--rule); border-radius: 0;
  }
  .scale-bars i.on { background: var(--deep); }
  .scale-bars i.on.hot { background: var(--warning); }
  .scale-value { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .hit h3 {
    font-family: Archivo, sans-serif; font-size: 17px; font-weight: 500;
    margin: 12px 0 8px; line-height: 1.3;
  }

  .hit blockquote {
    margin: 0; padding-left: 14px; border-left: 1px solid var(--rule);
    color: var(--ink); white-space: pre-wrap;
  }

  .hit footer { margin-top: 12px; font-size: 12px; color: var(--muted); }

  .empty { color: var(--muted); padding: 30px 0; }
  .empty a { color: var(--deep); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Cosine similarity over pgvector</p>
    <h1>Search the bulletins</h1>
    <p class="lede">
      Ask in plain language. The query is embedded with the same model as the
      stored text, then matched against every chunk by vector distance — so
      wording doesn't have to line up, only meaning.
    </p>
    <nav>
      <a href="/">Sync</a>
      <a href="/search" aria-current="page">Search</a>
    </nav>
  </header>

  <section class="card">
    <div>
      <label for="query">Query</label>
      <input type="text" id="query" placeholder="flash flood risk this weekend" autocomplete="off">
      <div class="examples">
        <button type="button" data-fill="flash flood risk this weekend">flash flood risk this weekend</button>
        <button type="button" data-fill="dangerous heat and humidity">dangerous heat and humidity</button>
        <button type="button" data-fill="strong winds affecting driving">strong winds affecting driving</button>
        <button type="button" data-fill="what should I do to stay safe">what should I do to stay safe</button>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="location">Location filter</label>
        <input type="text" id="location" placeholder="Any location">
      </div>
      <div>
        <label for="topk">Results</label>
        <input type="number" id="topk" value="5" min="1" max="20">
      </div>
      <div>
        <label for="source">Type filter</label>
        <select id="source">
          <option value="">Any type</option>
          <option value="alert">Alerts only</option>
          <option value="forecast">Forecasts only</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="go">Search</button>
      <label><input type="checkbox" id="summarize"> Summarize the top results</label>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <div id="results"></div>

</div>

<script>
  const $ = (id) => document.getElementById(id);
  const results = $("results");
  const status = $("status");

  function setStatus(message, kind) {
    status.textContent = message;
    status.className = "status" + (kind ? " " + kind : "");
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value == null ? "" : value;
    return div.innerHTML;
  }

  // Ten bins across the useful range of cosine similarity. Values below ~0.2
  // are effectively unrelated, so the scale starts there rather than at zero.
  function intensityScale(similarity) {
    const filled = Math.max(1, Math.min(10, Math.round((similarity - 0.2) / 0.08)));
    let bars = "";
    for (let i = 1; i <= 10; i++) {
      const on = i <= filled;
      bars += `<i class="${on ? (i > 7 ? "on hot" : "on") : ""}"></i>`;
    }
    return `<div class="scale">
              <div class="scale-bars" role="img"
                   aria-label="similarity ${similarity.toFixed(3)}">${bars}</div>
              <span class="scale-value">${similarity.toFixed(3)}</span>
            </div>`;
  }

  function renderHit(hit) {
    const when = hit.effective_at ? new Date(hit.effective_at).toLocaleString() : "";
    return `
      <article class="hit ${hit.source_type}">
        <div class="hit-top">
          <div class="hit-meta">
            <span class="chip ${hit.source_type}">${hit.source_type}</span>
            ${hit.severity ? `<span class="chip ${hit.severity}">${hit.severity}</span>` : ""}
            <span>${escapeHtml(hit.location)}</span>
            ${when ? `<span>${when}</span>` : ""}
          </div>
          ${intensityScale(hit.similarity)}
        </div>
        <h3>${escapeHtml(hit.headline || hit.event || "Untitled bulletin")}</h3>
        <blockquote>${escapeHtml(hit.chunk_text)}</blockquote>
        <footer>Chunk ${hit.chunk_index} of document ${escapeHtml(hit.document_id).slice(0, 24)}…</footer>
      </article>`;
  }

  async function search() {
    const query = $("query").value.trim();
    if (!query) return setStatus("Type something to search for.", "error");

    $("go").disabled = true;
    setStatus("Embedding the query and searching…");
    results.innerHTML = "";

    try {
      const resp = await fetch("/weather/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query,
          top_k: Number($("topk").value) || 5,
          location: $("location").value.trim() || undefined,
          source_type: $("source").value || undefined,
          summarize: $("summarize").checked,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || resp.statusText);

      if (!data.results.length) {
        results.innerHTML = `<p class="empty">${escapeHtml(data.message || "No matches.")}
          <a href="/">Go sync some documents.</a></p>`;
        setStatus("");
        return;
      }

      const summary = data.summary
        ? `<div class="summary"><p class="eyebrow">Summary</p><p>${escapeHtml(data.summary)}</p></div>`
        : "";

      results.innerHTML = summary + data.results.map(renderHit).join("");
      setStatus(`${data.count} passages, ranked by cosine similarity.`);
    } catch (err) {
      setStatus(err.message, "error");
    } finally {
      $("go").disabled = false;
    }
  }

  $("go").addEventListener("click", search);
  $("query").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
  document.querySelectorAll(".examples button").forEach(btn => {
    btn.addEventListener("click", () => { $("query").value = btn.dataset.fill; search(); });
  });
</script>
</body>
</html>
