# Databricks Workflow that runs notebooks/ingest_weather_embeddings.py on a
# schedule: harvest active NWS alerts and forecasts for the configured
# locations, then embed anything without current vectors into pgvector.
#
# Deploy:            databricks bundle deploy -t dev
# Run once manually: databricks bundle run ingest_weather_embeddings_job -t dev

resources:
  jobs:
    ingest_weather_embeddings_job:
      name: "[${bundle.target}] Ingest Weather Embeddings"
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      tasks:
        - task_key: ingest_weather_embeddings
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
            base_parameters:
              locations: Chicago, IL;Austin, TX;Miami, FL;New York, NY;Los Angeles, CA;Houston, TX;Phoenix, AZ
              documents_table: "weather_documents"
              embeddings_table: "weather_embeddings"
              embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
              nws_api_base_url: "https://api.weather.gov"
              nws_user_agent: "weather-intelligence-app (you@example.com)"
              source_types: "alert;forecast"
              fetch_limit: "50"
              chunk_size: "800"
              chunk_overlap: "100"
              skip_harvest: "false"
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
